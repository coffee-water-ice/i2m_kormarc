# HF Space는 컨테이너 하나당 공개 포트를 하나(7860)만 노출한다. 그 자리를
# 이 nginx가 받아서 세 갈래로 나눠준다:
#   /app/*        → react_dist/(React 정적 빌드, SPA라 없는 경로는 index.html로)
#   /api/*, /health → 내부 전용 FastAPI(127.0.0.1:8000)
#   그 외 전부      → 내부로 옮긴 스트림릿(127.0.0.1:7861, 웹소켓 포함)
#
# 컨테이너가 root가 아닌 UID 1000으로 돈다(Dockerfile 참고) — apt로 깐 nginx의
# 기본 경로(/var/log/nginx, /var/lib/nginx 등)는 그 사용자가 못 쓸 수 있어
# 전부 /tmp 아래로 돌린다. 그래서 시스템 기본 nginx.conf를 안 쓰고
# start.sh가 `nginx -c <이 파일>`로 직접 지정해서 띄운다.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    # -c로 이 파일을 직접 지정해 띄우므로(아래 참고), prefix 추정에 기대지 않고
    # 경로를 명시한다.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 7860;

        # "/app"(끝 슬래시 없이)은 prefix location "/app/"에 안 걸려서 그대로
        # 두면 아래 스트림릿 catch-all로 새서 엉뚱한 화면이 뜬다 — 슬래시를
        # 붙여서 다시 보낸다.
        location = /app {
            return 301 /app/;
        }

        # React 정적 빌드(react_dist/README.md 참고 — 이 저장소가 직접 빌드하는
        # 게 아니라 미리 빌드해서 커밋해 둔 결과물). try_files로 SPA 라우팅 지원 —
        # "/app/isbn"처럼 index.html이 아닌 경로를 새로고침해도 404 대신
        # index.html을 돌려줘서 React Router가 클라이언트에서 처리하게 한다.
        #
        # auth_gate.py의 비밀번호 게이트는 스트림릿 페이지 코드 안에서만 동작해서
        # nginx가 새로 여는 이 경로는 그 보호를 못 받는다 — 같은 APP_PASSWORD를
        # 여기서 Basic Auth로 재사용한다(start.sh가 기동 시 htpasswd 파일을 만들고,
        # APP_PASSWORD가 비어 있으면 잠금 자체를 비활성화해서 로컬 개발 시의
        # auth_gate.py 완화 동작과 맞춘다 — /tmp/nginx-auth.conf 참고).
        location /app/ {
            include /tmp/nginx-auth.conf;
            alias /home/user/app/react_dist/;
            try_files $uri $uri/ /app/index.html;
        }

        # FastAPI(내부 전용) 그대로 중계 — 경로를 안 바꾼다. 백엔드 라우트 자체가
        # 이미 /api/... 프리픽스를 갖고 있어서(app.py) proxy_pass에 뒤 경로를
        # 안 붙여도(호스트만 지정) 원래 URI가 그대로 전달된다. /app과 같은 이유로
        # Basic Auth 보호 — 안 그러면 프론트만 잠그고 API는 직접 두들기면 그대로
        # 뚫려서 잠금 자체가 무의미해진다.
        location /api/ {
            include /tmp/nginx-auth.conf;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
        }

        # 나머지 전부 → 스트림릿(내부 7861). _stcore/stream 웹소켓이 끊기지
        # 않도록 Upgrade/Connection 헤더와 긴 read timeout이 필요하다(스트림릿
        # 공식 리버스 프록시 가이드와 동일한 패턴).
        location / {
            proxy_pass http://127.0.0.1:7861;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
    }
}

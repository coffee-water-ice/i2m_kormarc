name: HF Space 배포

# main에 푸시될 때마다 HuggingFace Space에 반영한다.
# 수동 배포하던 시절에는 "지금 배포된 게 어느 커밋인지" 알 수 없었고,
# 팀원이 main에 올린 변경이 Space에 반영되지 않은 채 남아 있었다.
on:
  push:
    branches: [main]
  workflow_dispatch:        # 필요할 때 수동 실행

concurrency:
  # 연달아 푸시되면 마지막 것만 배포한다. 중간 상태를 배포하느라 시간을 쓰지 않는다.
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # Space는 git 히스토리를 요구하지 않는다. 얕게 받아 시간을 아낀다.
          fetch-depth: 1

      - name: Space 설정 머리말 붙이기
        # HF Space는 README.md 맨 위의 YAML 머리말에서 SDK와 포트를 읽는다.
        # 저장소 README에 두면 GitHub 문서 맨 앞에 설정 블록이 노출되므로,
        # 배포 시점에만 붙인다.
        run: |
          cat > /tmp/hf_header.md <<'EOF'
          ---
          title: I2M KORMARC 통합 변환 시스템
          emoji: 📚
          colorFrom: indigo
          colorTo: gray
          sdk: docker
          app_port: 7860
          pinned: false
          short_description: ISBN으로 KORMARC 레코드 초안을 자동 생성한다
          ---

          EOF
          cat /tmp/hf_header.md README.md > /tmp/README.hf.md
          mv /tmp/README.hf.md README.md
          head -12 README.md

      - name: Space에 푸시
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: I2M/i2m-kormarc
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN 시크릿이 없습니다. 저장소 Settings > Secrets에 등록하세요." >&2
            exit 1
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Space 저장소는 GitHub 히스토리와 무관하므로, 현재 트리만 담은
          # 단일 커밋을 만들어 강제로 덮어쓴다. 히스토리는 GitHub에 남아 있다.
          rm -rf .git
          git init -q -b main
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q --force \
            "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${SPACE_ID}" main
          echo "배포 완료: ${GITHUB_SHA::7} -> ${SPACE_ID}"
